name: video_player_linux
description: Linux implementation of the video_player plugin.
repository: https://github.com/flutter/packages/tree/main/packages/video_player/video_player_linux
issue_tracker: https://github.com/flutter/flutter/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+video_player%22
version: 2.5.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.10.0"

flutter:
  plugin:
    implements: video_player
    platforms:
      linux:
        dartPluginClass: LinuxVideoPlayer
        pluginClass: VideoPlayerLinuxPlugin

dependencies:
  flutter:
    sdk: flutter
  video_player_platform_interface: ">=6.1.0 <7.0.0"
  # Native-assets build hook deps — drive CMake at `dart pub get` time
  # so the zero-copy FFI surface (vp_init_api_dl, vp_register_port, …)
  # is available for @Native / DynamicLibrary.process() lookups.
  code_assets: ^1.0.0
  hooks: ^1.0.2

dev_dependencies:
  build_runner: ^2.3.0
  flutter_test:
    sdk: flutter
  mockito: 5.4.4
  pigeon: ^22.0.0

topics:
  - video
  - video-player
